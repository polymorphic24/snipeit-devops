apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.2.0
          args:
            - tunnel
            - run
            - facc89fd-82bd-4201-aa77-87220421f000
          volumeMounts:
            - name: tunnel-creds
              mountPath: /etc/cloudflared
      volumes:
        - name: tunnel-creds
          secret:
            secretName: cloudflare-tunnel
